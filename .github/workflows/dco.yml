# Checks that every commit in a pull request carries a Signed-off-by line.
#
# The sign-off is the contributor certifying they wrote the code and can
# license it under Apache-2.0 — see the Developer Certificate of Origin at
# https://developercertificate.org. `git commit -s` adds it; `git rebase
# --signoff main` fixes a branch that forgot.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole PR range plus its base, so every commit can be read.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Assign FIRST, loop second. `for c in $(git rev-list ...)` swallows a
          # git failure: the substitution yields an empty list, the loop body
          # never runs, and the job reports "all signed off" having examined
          # nothing — a gate that goes green on zero work, which is worse than
          # no gate because branch protection then trusts it. `set -e` does not
          # catch a substitution used as a for-word-list, but it does catch an
          # assignment, whose exit status is the substitution's.
          #
          # --no-merges: a merge commit is not authored content, and asking a
          # contributor to sign off on GitHub's own merge is noise.
          commits=$(git rev-list --no-merges "$BASE".."$HEAD")

          missing=0
          examined=0
          for commit in $commits; do
            examined=$((examined + 1))
            if ! git log -1 --format='%B' "$commit" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::missing Signed-off-by: $(git log -1 --format='%h %s' "$commit")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add sign-offs to the commits above:"
            echo "  git rebase --signoff ${BASE}"
            echo "  git push --force-with-lease"
            echo ""
            echo "Signing off certifies you wrote the code and can contribute it"
            echo "under Apache-2.0. See https://developercertificate.org"
            exit 1
          fi
          # Say how many, so a green tick can never hide an empty run.
          echo "All $examined commit(s) signed off."
