# Every check a contributor can run locally, run on every push and PR.
#
# The design constraint that makes this cheap: the smoke suites need no ffmpeg,
# no GPU, no API key and no network. That is a property worth protecting — if a
# new test needs one of those, it belongs in the `render` job below, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same PR cancels the previous run rather than queueing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >= 3.10, so the floor is tested
        # too. A change that quietly needs 3.12 syntax fails here, not in
        # somebody's editor.
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: qatf-backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: qatf-backend/pyproject.toml

      - name: Install
        # [all] pulls every provider SDK and the track extra, so smoke_llm
        # can import the clients it fakes and verify_render's OpenCV path is
        # importable. [dev] adds httpx and ruff.
        run: pip install -e ".[all,dev]"

      - name: Lint
        run: ruff check .

      - name: smoke_db
        run: python tests/smoke_db.py

      - name: smoke_pipeline
        run: python tests/smoke_pipeline.py

      - name: smoke_llm
        run: python tests/smoke_llm.py

      - name: smoke_api
        run: python tests/smoke_api.py

      - name: load_api
        # Concurrency behaviour, and it asserts — it caught two regressions
        # that no sequential test could see.
        #
        # 8 threads, not the default 24: the suite's latency budgets were
        # measured on a 16-core machine and its own header calls them
        # "generous enough not to flake on a loaded laptop". A 2-4 vCPU shared
        # runner is not a loaded laptop — 24 threads there queue an order of
        # magnitude worse, and a p99 budget blown by contention reads exactly
        # like a real concurrency regression in somebody's unrelated PR. The
        # two assertions that caught real bugs are throughput- and
        # marginal-cost-shaped, not thread-count-shaped, so they survive the
        # smaller profile intact.
        run: python tests/load_api.py --concurrency 8

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qatf-frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qatf-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # `npm run build` is `tsc --noEmit && vite build`, so this is the
        # type gate as well as the bundle.
        run: npm run build

  render:
    name: render verification (needs ffmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qatf-backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qatf-backend/pyproject.toml

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache the face fixture
        # verify_render's fixture B needs a photo of a real face, fetched once
        # and cached under ~/.cache/qatf. A runner is always cold, so without
        # this every PR re-fetches it from an external host — and on a 403,
        # a rate-limit or a captive response the suite SKIPS and the job still
        # goes green. Fixture B is the ONLY thing that exercises YuNet, the
        # detection-against-ground-truth score, and the face-cache-key checks,
        # so a silent skip is the job quietly not testing the feature it exists
        # for. QATF_REQUIRE_FIXTURES below turns that skip into a failure.
        uses: actions/cache@v4
        with:
          path: ~/.cache/qatf
          key: qatf-face-fixture-v1

      - name: Install
        run: pip install -e ".[all,dev]"

      - name: verify_render
        # Renders real clips and measures where the subject actually landed —
        # the only honest way to verify a filtergraph. Every fixture also
        # renders a `crop` control and asserts the control FAILS, so a broken
        # harness cannot pass by finding nothing.
        #
        # QATF_REQUIRE_FIXTURES makes an unavailable fixture a FAILURE here,
        # while it stays a skip for a contributor working offline. Without it
        # this job can pass having exercised none of the detector.
        env:
          QATF_REQUIRE_FIXTURES: "1"
        run: python tests/verify_render.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build the frontend image
        # Fast, and it runs `tsc --noEmit && vite build` inside the image, so
        # a Dockerfile that has drifted from the source is caught here.
        run: docker build -t qatf-frontend:ci ./qatf-frontend

      - name: Validate both compose files
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml config -q

      # The backend image is deliberately NOT built here: it installs CUDA
      # wheels and weighs over 6 GB, which is minutes of runner time on every
      # PR for a Dockerfile that changes rarely. Build it in a release
      # workflow, or locally, instead.
