    - paragraph [ref=e18]: Harvest the parts of a long video worth watching.
    - generic [ref=e20]:
      - paragraph [ref=e21]: Turn a long video into vertical short-form clips.
      - paragraph [ref=e22]:
        - text: A model picks the moments. Everything about
        - strong [ref=e23]: where the cuts land
        - text: is deterministic — and that split is the whole design.
      - separator [ref=e24]
      - heading "The five stages" [level=2] [ref=e25]
      - table [ref=e26]:
        - rowgroup [ref=e27]:
          - row [ref=e28]:
