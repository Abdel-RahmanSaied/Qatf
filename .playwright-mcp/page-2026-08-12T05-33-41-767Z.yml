        - rowgroup [ref=e33]:
          - row [ref=e34]:
            - cell "1" [ref=e35]
            - cell "demux to 16 kHz mono wav" [ref=e36]
            - cell "ffmpeg" [ref=e37]
            - cell "no" [ref=e38]
          - row [ref=e39]:
            - cell "2" [ref=e40]
            - cell "transcribe with word timings" [ref=e41]
            - cell "faster-whisper" [ref=e42]
            - cell "no" [ref=e43]
          - row [ref=e44]:
            - cell "3" [ref=e45]
            - cell "pick the clips" [ref=e46]
            - cell "your chosen LLM" [ref=e47]
            - cell [ref=e48]:
              - strong [ref=e49]: "yes"
          - row [ref=e50]:
            - cell "4" [ref=e51]
            - cell "snap cuts to word boundaries" [ref=e52]
            - cell "deterministic" [ref=e53]
            - cell "no" [ref=e54]
          - row [ref=e55]:
            - cell "5" [ref=e56]
            - cell "reframe, caption, encode" [ref=e57]
            - cell "ffmpeg" [ref=e58]
            - cell "no" [ref=e59]
      - paragraph [ref=e60]:
        - text: Only stage 3 is a model call. Because stages 1, 4 and 5 are model-free,
        - strong [ref=e61]: changing provider cannot affect cut accuracy or rendering
        - text: — it changes only
        - emphasis [ref=e62]: which passages
        - text: get picked.
      - heading "The core invariant" [level=2] [ref=e63]
      - paragraph [ref=e64]:
        - text: The model never emits precise timing. It reads the transcript in ~12-second blocks and returns
        - code [ref=e65]: MM:SS
        - text: . Stage 4 then moves those onto real word start/end times from Whisper.
      - blockquote [ref=e66]:
        - paragraph [ref=e67]:
          - text: Semantic boundaries come from the model. Acoustic boundaries come from the audio.
          - strong [ref=e68]: They are never mixed.
      - paragraph [ref=e69]:
        - text: This applies to hand-edited plans too, which is why
        - code [ref=e70]: "PUT /jobs/{id}/plan"
        - text: re-snaps by default. A human typing
        - code [ref=e71]: "\"start\": 20.0"
        - text: is making the same kind of semantic guess the model makes — and skipping the snap is how a clip ends up opening mid-syllable.
      - heading "Working with jobs" [level=2] [ref=e72]
      - paragraph [ref=e73]:
        - text: Nothing here is synchronous. Every start returns
        - strong [ref=e74]: "202"
        - text: and a job id; poll
        - code [ref=e75]: "GET /jobs/{id}"
        - text: and read
        - code [ref=e76]: state
        - text: .
      - code [ref=e78]: queued → extracting → transcribing → selecting → planned → rendering → done ↑ │ PUT /plan ──┘ ↓ failed · cancelled
      - paragraph [ref=e79]:
        - text: Set
        - code [ref=e80]: "auto_render: false"
        - text: to stop at
        - code [ref=e81]: planned
        - text: ", review the plan,"
        - code [ref=e82]: PUT
        - text: an edited one, then
        - code [ref=e83]: "POST /jobs/{id}/render"
        - text: . Re-rendering needs no model call and no re-transcription, which is what makes the round trip cheap.
      - heading "Before you submit an hour of audio" [level=2] [ref=e84]
      - paragraph [ref=e85]:
        - text: Call
        - code [ref=e86]: GET /healthz
        - text: . It reports whether ffmpeg is genuinely on
        - code [ref=e87]: PATH
        - text: ", whether the stage-3 provider has a usable credential, and"
        - strong [ref=e88]: which device stage 2 will actually use
        - text: . A missing API key otherwise surfaces only after transcription has already run.
      - heading "Three things this job model does not do" [level=2] [ref=e89]
      - list [ref=e90]:
        - listitem [ref=e91]:
          - strong [ref=e92]: Jobs do not survive a restart.
          - text: State is a JSON file per job, but the worker is an in-process thread pool. On startup anything left running is marked
          - code [ref=e93]: "failed: interrupted by a server restart"
          - text: .
        - listitem [ref=e94]:
          - strong [ref=e95]: Cancellation is cooperative.
          - text: The flag is checked between stages and between clips. It cannot interrupt an ffmpeg or Whisper call already in flight.
        - listitem [ref=e96]:
          - strong [ref=e97]:
            - code [ref=e98]: QATF_WORKERS
            - text: defaults to 1.
          - text: Two concurrent
          - code [ref=e99]: large-v3
          - text: loads fight over the same GPU. Raise it only for render-only work.
      - heading "Errors" [level=2] [ref=e100]
      - paragraph [ref=e101]:
        - text: Domain failures carry their own status code and always come back as
        - code [ref=e102]: "{\"detail\": \"...\"}"
        - text: . There is no per-case mapping in the routers — one handler translates the whole
        - code [ref=e103]: QatfError
        - text: hierarchy, which is why HTTP concerns stay out of the pipeline entirely.
      - table [ref=e104]:
        - rowgroup [ref=e105]:
          - row [ref=e106]:
            - columnheader "Status" [ref=e107]
            - columnheader "Means" [ref=e108]
        - rowgroup [ref=e109]:
