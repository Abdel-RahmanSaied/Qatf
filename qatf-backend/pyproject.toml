[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qatf"
version = "0.4.0"
description = "Harvest the parts of a long video worth watching — vertical shorts with burned-in captions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
keywords = ["video", "shorts", "captions", "whisper", "ffmpeg", "arabic"]

# The pipeline itself. ffmpeg is a system dependency and must be on PATH.
# No provider SDK here: stage 3's provider is chosen at runtime, so its client
# library is an extra. Installing every SDK to use one of them is waste.
dependencies = [
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
# The CLI does not need these. Keeping them optional is what lets `qatf.cli`
# stay importable without pydantic.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]
# stage 3 providers — install the one you use
anthropic = ["anthropic>=0.40"]
# the openai SDK also drives Kimi, GLM, vLLM, Ollama and OpenRouter
openai = ["openai>=1.40"]
# stage 4b — only `--reframe track` needs these. Deliberately its own extra:
# opencv is a large wheel and every other mode renders without it.
#
# Licences ruled out the obvious alternatives: ultralytics/YOLO is AGPL-3.0, and
# insightface/SCRFD ships MIT code with weights licensed for non-commercial
# research only. Both are a problem for anything sold.
#
# YuNet (cv2.FaceDetectorYN) is in the plain wheel on BOTH majors —
# objdetect/face.hpp is byte-identical between the 4.x and 5.x branches — so
# create() needs no version branch. `<6` because 5.0 already proved a major bump
# moves this module: it sent CascadeClassifier to opencv_contrib and dropped
# every cascade XML. `headless` because qatf never opens a window and the plain
# wheel needs libGL.so.1, which the python:3.12-slim base in Dockerfile does not
# carry. Exactly ONE opencv distribution may be installed — all four own the
# `cv2` namespace, and two together break it in a way that reads as a bad model
# file. `detect._open_detector` names that cause if it ever happens.
track = [
    "opencv-python-headless>=4.10,<6",
    "numpy>=1.24",
]
# stage 0 — only a URL source needs this. Its own extra for the same reason
# `track` is: the pipeline must keep installing, and running, without it.
#
# yt-dlp rather than pytube or a hand-rolled fetcher because YouTube changes its
# player constantly and yt-dlp is the only one that keeps up; a fetcher that
# breaks silently in three months is worse than no fetcher. It is also the
# reason `fetch.py` owns a URL allowlist: yt-dlp reads `file://` and carries
# extractors for a thousand sites, so the breadth that makes it the right tool
# is exactly what has to be fenced off at the boundary.
youtube = [
    "yt-dlp>=2024.1",
]
all = [
    "qatf[api,anthropic,openai,track,youtube]",
]
dev = [
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
qatf = "qatf.cli:main"
qatf-serve = "qatf.api.__main__:main"

[tool.hatch.build.targets.wheel]
# only the package — qatf.py at the root is a legacy shim, not a module to ship
packages = ["qatf"]
# stated explicitly so a future .gitignore edit cannot silently ship a wheel
# whose tracking extra installs but whose detector has no weights
artifacts = ["qatf/pipeline/assets/*.onnx"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",    # FastAPI's Depends()/File() in defaults is the documented idiom
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"qatf/pipeline/__init__.py" = ["F401"]   # deliberate re-export surface
"qatf.py" = ["E402"]                     # import must follow the sys.path fix
# the ASS [V4+ Styles] Format/Style pair is a fixed single-line format. Wrapping
# it produces a subtitle file libass will not parse.
"qatf/pipeline/captions.py" = ["E501"]
