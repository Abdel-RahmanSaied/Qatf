# Serves the static build and proxies /api/* to the backend service.
# The backend's routes are /jobs, /healthz — it never learns a proxy exists.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # Docker's embedded DNS, re-resolved every 10s.
        #
        # A literal name in proxy_pass is resolved ONCE at config load and
        # cached forever, so `docker compose up -d --build qatf` gives the
        # backend a new IP and every /api/* call 502s until the FRONTEND is
        # restarted too — the UI just says "cannot reach the server" and
        # nothing points at the cause. Naming the upstream through a variable
        # forces a runtime lookup instead.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $qatf_upstream qatf;

        # A variable in proxy_pass disables nginx's implicit URI rewriting, so
        # the /api prefix strip that the trailing slash used to do has to be
        # written out. Both halves are load-bearing: change one and the
        # backend starts seeing /api/jobs, which is a 404.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$qatf_upstream:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Uploads are multi-GB. nginx's 1 MB default would kill every upload
        # before FastAPI's QATF_MAX_UPLOAD_MB check ever ran; 0 disables the
        # nginx limit rather than duplicating that number here.
        #
        # This is NOT an ingress limit anywhere: FastAPI's check only fires
        # after Starlette has spooled the whole body to a temp file. See
        # docs/security.md — put a real cap in front of anything exposed.
        client_max_body_size 0;
        # Stream the body through instead of spooling gigabytes to nginx's
        # temp dir first — also what makes upload progress bars honest.
        proxy_request_buffering off;

        # Clip downloads and slow endpoints.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback: /jobs/abc123 is a client-side route, not a file.
    location / {
        try_files $uri /index.html;
    }
}
