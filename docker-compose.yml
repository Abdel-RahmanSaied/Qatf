# qatf + a self-hosted open-source LLM for stage 3.
#
#   docker compose up qatf                       # hosted provider (Anthropic/OpenAI/Kimi/GLM)
#   docker compose --profile ollama up           # + local GLM-4-9B via Ollama
#   docker compose --profile vllm up             # + local GLM-4-9B via vLLM (needs a GPU)
#
# Which open-source model can actually run here matters:
#   Kimi K2 is ~1T parameters. It does NOT self-host on a single consumer GPU —
#   use the hosted Moonshot API (provider `kimi`) or OpenRouter.
#   GLM-4-9B does fit one 16-24GB GPU quantised, and is the model both local
#   profiles below pull.

services:
  qatf:
    build: .
    ports: ["8000:8000"]
    environment:
      QATF_HOST: "0.0.0.0"
      QATF_DATA_DIR: /data
      QATF_MEDIA_ROOT: /media
      QATF_WORKERS: "1"
      # --- stage 3 provider -------------------------------------------
      QATF_LLM_PROVIDER: "${QATF_LLM_PROVIDER:-anthropic}"
      QATF_LLM_MODEL: "${QATF_LLM_MODEL:-}"
      QATF_LLM_BASE_URL: "${QATF_LLM_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      MOONSHOT_API_KEY: "${MOONSHOT_API_KEY:-}"
      ZHIPU_API_KEY: "${ZHIPU_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      - ./qatf-data:/data
      - ./media:/media:ro
    # GPU for faster-whisper. Drop this block and set --device cpu if there is none.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # ---- local open-source model, easy path -----------------------------
  # Then: QATF_LLM_PROVIDER=ollama QATF_LLM_BASE_URL=http://ollama:11434/v1
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # One-shot: pull the model so the first clip request isn't a cold download.
  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: {OLLAMA_HOST: "http://ollama:11434"}
    entrypoint: ["sh", "-c", "ollama pull glm4:9b"]
    restart: "no"

  # ---- local open-source model, serious path --------------------------
  # vLLM supports guided decoding, so json_schema is real here rather than
  # best-effort — the `vllm` preset declares json_schema for that reason.
  # Then: QATF_LLM_PROVIDER=vllm QATF_LLM_BASE_URL=http://vllm:8000/v1
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    ports: ["8001:8000"]
    volumes: ["hf:/root/.cache/huggingface"]
    environment: {HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"}
    command: >
      --model zai-org/GLM-4-9B-0414
      --max-model-len 32768
      --gpu-memory-utilization 0.90
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  ollama:
  hf:
